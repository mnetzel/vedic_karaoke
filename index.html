<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Vedic Karaoke</title>
    <script>
      window.__assetVersion = Date.now();
      document.write(`<link rel="stylesheet" href="style.css?v=${window.__assetVersion}">`);
    </script>
  </head>
  <body>
    <div class="controls floating-controls" aria-label="Sterowanie">
      <div id="tempoControls" class="tempo-controls" aria-label="Tempo odtwarzania">
        <button type="button" data-rate="0.7" aria-pressed="false">Slow</button>
      </div>
      <div id="repeatControls" class="repeat-controls" aria-label="Liczba powtórzeń">
        <button type="button" data-repeat="3" aria-pressed="false">x3</button>
        <button type="button" data-repeat="4" aria-pressed="false">x4</button>
        <button type="button" data-repeat="5" aria-pressed="true">x5</button>
      </div>
      <div id="filterControls" class="filter-controls" aria-label="Filtr ślok">
        <button type="button" data-filter="all" aria-pressed="true">★★★</button>
        <button type="button" data-filter="2" aria-pressed="false">★★</button>
        <button type="button" data-filter="1" aria-pressed="false">★</button>
      </div>
      <div id="scriptControls" class="script-controls" aria-label="Wariant tekstu">
        <button type="button" data-script="Devanagari" aria-pressed="true">Devanagari</button>
        <button type="button" data-script="IAST" aria-pressed="false">IAST</button>
        <button type="button" data-script="PL" aria-pressed="false">PL</button>
      </div>
      <button id="resetProgressButton" type="button" title="Resetuj oceny">Reset</button>
      <button id="stopButton" type="button" title="Zatrzymaj">Stop</button>
    </div>

    <main class="app-shell">
      <header class="topbar">
        <div class="brand-panel">
          <h1>Vedic Karaoke</h1>
          <div class="chant-heading">
            <p class="subtitle">Śri Suktam</p>
            <img class="chant-image" src="input/image.jpg" alt="">
            <p class="audio-credit">
              Audio by
              <a href="https://on.soundcloud.com/ifmZR7Az24mCGEZPSR" target="_blank" rel="noopener noreferrer">
                Shantala Sriramaiah
              </a>
            </p>
          </div>
          <p id="summary">Ładowanie TextGrida...</p>
        </div>
      </header>

      <section id="segments" class="segments" aria-live="polite"></section>
    </main>

    <script>
      document.write(`<script src="app.js?v=${window.__assetVersion}" charset="utf-8"><\/script>`);
    </script>
  </body>
</html>
