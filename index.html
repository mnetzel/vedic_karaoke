<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Vedic Karaoke</title>
    <script>
      window.__assetVersion = Date.now();
      document.write(`<link rel="stylesheet" href="style.css?v=${window.__assetVersion}">`);
    </script>
  </head>
  <body>
    <div class="controls floating-controls" aria-label="Sterowanie">
      <div id="tempoControls" class="tempo-controls" aria-label="Tempo odtwarzania">
        <button type="button" data-rate="0.7" aria-pressed="false">Wolniej</button>
      </div>
      <div id="textSizeControls" class="text-size-controls" aria-label="Rozmiar tekstu">
        <button id="textSizeButton" type="button" aria-pressed="false">
          <span class="size-a size-a-small">A</span>
          <span class="size-a size-a-medium">A</span>
          <span class="size-a size-a-large">A</span>
        </button>
      </div>
      <button id="hidePadasButton" type="button" aria-pressed="false">Ukryj frazy</button>
      <button id="audioVariantButton" type="button" hidden>Audio</button>
      <div id="filterControls" class="filter-controls" aria-label="Filtr ślok">
        <button type="button" data-filter="all" aria-pressed="true">★★★</button>
        <button type="button" data-filter="2" aria-pressed="false">★★</button>
        <button type="button" data-filter="1" aria-pressed="false">★</button>
      </div>
      <button id="stopButton" type="button" title="Zatrzymaj">Stop</button>
      <div id="scriptControls" class="script-controls" aria-label="Wariant tekstu">
        <button type="button" data-script="Devanagari" aria-pressed="true">Devanagari</button>
        <button type="button" data-script="IAST" aria-pressed="false">IAST</button>
        <button type="button" data-script="PL" aria-pressed="false">PL</button>
      </div>
    </div>

    <main class="app-shell">
      <section id="chantChooser" class="chant-chooser" aria-labelledby="chantChooserTitle">
        <div class="chooser-header">
          <h1 id="chantChooserTitle">Vedic Karaoke</h1>
        </div>
        <div class="chant-options">
          <button class="chant-card" type="button" data-chant-id="sri-suktam">
            <img data-chant-image alt="">
            <span data-chant-title>Śri Suktam</span>
          </button>
          <button class="chant-card" type="button" data-chant-id="sri-rudram">
            <img data-chant-image alt="">
            <span data-chant-title>Śri Rudram</span>
          </button>
        </div>
      </section>

      <section id="collectionChooser" class="chant-chooser collection-chooser" aria-labelledby="collectionTitle" hidden>
        <div class="chooser-header">
          <h1>Vedic Karaoke</h1>
          <button id="collectionHomeButton" class="change-chant-button" type="button">Strona główna</button>
          <p id="collectionTitle" class="subtitle">Śri Rudram</p>
          <img id="collectionImage" class="chant-image" src="input/sri-rudram/Sri_Rudram.jpg" alt="">
        </div>

        <div id="sectionChooserPanel">
          <div id="sectionOptions" class="chant-options section-options"></div>
        </div>

        <div id="anuvakaChooserPanel" hidden>
          <button id="sectionBackButton" class="change-chant-button" type="button">Śri Rudram</button>
          <p id="sectionTitle" class="section-title">Namakam</p>
          <div id="anuvakaOptions" class="anuvaka-options"></div>
        </div>
      </section>

      <div id="karaokeView" hidden>
        <header class="topbar">
          <div class="brand-panel">
            <h1>Vedic Karaoke</h1>
            <button id="changeChantButton" class="change-chant-button" type="button">Strona główna</button>
            <div class="chant-heading">
              <p id="chantTitle" class="subtitle">Śri Suktam</p>
              <img id="chantImage" class="chant-image" src="input/sri-suktam/Sri_Suktam.jpg" alt="">
              <div id="anuvakaNavigation" class="anuvaka-navigation" hidden>
                <button id="previousAnuvakaButton" class="change-chant-button" type="button"></button>
                <button id="collectionBackButton" class="change-chant-button" type="button">Śri Rudram</button>
                <button id="nextAnuvakaButton" class="change-chant-button" type="button"></button>
              </div>
              <p id="audioCredit" class="audio-credit">
                Audio by
                <a
                  id="audioCreditLink"
                  href="https://on.soundcloud.com/ifmZR7Az24mCGEZPSR"
                  target="_blank"
                  rel="noopener noreferrer"
                >
                  Shantala Sriramaiah
                </a>
              </p>
            </div>
            <p id="summary">Ładowanie TextGrida...</p>
          </div>
        </header>

        <section class="top-controls" aria-label="Ustawienia">
          <div id="translationControls" class="translation-controls" aria-label="Język tłumaczenia">
            <button type="button" data-translation-language="eng" aria-pressed="false">
              <img src="input/flag-gb.svg" alt="English">
            </button>
            <button type="button" data-translation-language="pl" aria-pressed="true">
              <img src="input/flag-pl.svg" alt="Polski">
            </button>
          </div>
          <div id="repeatControls" class="repeat-controls" aria-label="Liczba powtórzeń">
            <button type="button" data-repeat="3" aria-pressed="false">x3</button>
            <button type="button" data-repeat="4" aria-pressed="false">x4</button>
            <button type="button" data-repeat="5" aria-pressed="true">x5</button>
          </div>
          <div id="repeatGapControls" class="repeat-gap-controls" aria-label="Przerwa między powtórzeniami">
            <button type="button" data-repeat-gap="0.5" aria-pressed="true">0.5s</button>
            <button type="button" data-repeat-gap="1" aria-pressed="false">1s</button>
          </div>
          <div id="pitchControls" class="pitch-controls" aria-label="Wysokość dźwięku">
            <button id="pitchButton" type="button" aria-pressed="false">Pitch</button>
          </div>
          <button id="resetProgressButton" type="button" title="Resetuj oceny">Reset</button>
        </section>

        <section class="full-chant-panel">
          <button id="fullChantButton" class="full-chant-button" type="button" aria-pressed="false">
            Full chant
          </button>
          <button id="fullChantFastButton" class="full-chant-button" type="button" aria-pressed="false">
            Full chant faster
          </button>
        </section>

        <section id="segments" class="segments" aria-live="polite"></section>
      </div>
    </main>

    <div id="translationModal" class="translation-modal" hidden>
      <div class="translation-backdrop" data-close-translation></div>
      <section
        class="translation-dialog"
        role="dialog"
        aria-modal="true"
        aria-labelledby="translationTitle"
        tabindex="-1"
      >
        <button id="translationCloseButton" class="translation-close" type="button" aria-label="Close translation">
          ×
        </button>
        <h2 id="translationTitle">Translation</h2>
        <div id="translationBody" class="translation-body"></div>
      </section>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
    <script>
      document.write(`<script src="app.js?v=${window.__assetVersion}" charset="utf-8"><\/script>`);
    </script>
  </body>
</html>
